name: Update profile cards

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC: picks up new stars, forks, descriptions
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_cards.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # FEATURED_REPOS: "MiniRag_26,Modablag,FluentAI,BnSR"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore: refresh profile cards"
          # main may have moved while we ran (your pushes, other workflows): rebase and retry
          for attempt in 1 2 3 4; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 5))
          done
          exit 1
