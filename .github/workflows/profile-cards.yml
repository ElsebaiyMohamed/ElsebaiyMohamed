name: Update profile cards

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours: picks up new stars, forks, descriptions
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_cards.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/generate_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          # FEATURED_REPOS: "MiniRag_26,Modablag,FluentAI,BnSR"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || (git commit -m "chore: refresh profile cards" && git push)
